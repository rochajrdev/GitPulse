<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Defs for premium gradients and glow effects -->
  <defs>
    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulse Gradient (Teal to Purple) -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Orbe Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bg-glow)" />

  <!-- Outer Ring (Broken Git circle) -->
  <circle cx="256" cy="256" r="200" stroke="url(#pulse-grad)" stroke-width="8" stroke-dasharray="600 40 40 40" fill="none" opacity="0.3" stroke-linecap="round" />

  <!-- The Git Pulse Wave (Heartbeat pulse) -->
  <path d="M 96 256 H 180 L 210 120 L 256 392 L 290 190 L 320 280 L 340 256 H 416" 
        stroke="url(#pulse-grad)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Git Commit Nodes (Glow circles) at key peaks and connections -->
  <!-- Left node -->
  <circle cx="180" cy="256" r="14" fill="#00f2fe" filter="url(#neon-glow)" />
  <circle cx="180" cy="256" r="24" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.6" />

  <!-- High Peak node -->
  <circle cx="210" cy="120" r="14" fill="#00f2fe" filter="url(#neon-glow)" />
  <circle cx="210" cy="120" r="24" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Low Valley node -->
  <circle cx="256" cy="392" r="14" fill="#8b5cf6" filter="url(#neon-glow)" />
  <circle cx="256" cy="392" r="24" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Right node -->
  <circle cx="340" cy="256" r="14" fill="#8b5cf6" filter="url(#neon-glow)" />
  <circle cx="340" cy="256" r="24" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.6" />
</svg>